name: Bug report
description: Report incorrect compiler behaviour, a crash, or a wrong diagnostic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here; see SECURITY.md.
  - type: textarea
    id: program
    attributes:
      label: Gable source
      description: The smallest program that shows the problem.
      render: gable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full compiler output and exit status.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Compiler version
      description: Output of `gable --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and toolchain
      description: "For example: Ubuntu 24.04, GCC 13.2, CMake 3.28, Ninja 1.11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lexer
        - Parser
        - Semantic analysis
        - Code generation
        - Runtime
        - CLI and build
        - Documentation
        - Other
    validations:
      required: true
