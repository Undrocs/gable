name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: "OFF"
            werror: "ON"
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: "OFF"
            werror: "OFF"
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: "OFF"
            werror: "OFF"
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: "ON"
            werror: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++ clang lld
          cmake --version
          ninja --version

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DGABLE_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DGABLE_WARNINGS_AS_ERRORS=${{ matrix.werror }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the CLI
        run: |
          ./build/gable --version
          ./build/gable run examples/hello.gable
          ./build/gable build examples/primes.gable -o /tmp/primes
          /tmp/primes | head -5

  install:
    name: Install and use from a prefix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/gable-install"
          cmake --build build --parallel
          cmake --install build

      - name: Compile and run an example with the installed compiler
        run: |
          export PATH="$HOME/gable-install/bin:$PATH"
          gable --version
          gable run examples/fibonacci.gable | head -5
